<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>og</title>
    <style>
      html, body { margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
        background: #0b1220;
        color: #f8fafc;
        overflow: hidden;
      }
      .bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(circle at 18% 20%, rgba(28,126,214,.45), transparent 36%),
          radial-gradient(circle at 88% 78%, rgba(34,184,207,.35), transparent 32%),
          #0b1220;
      }
      .card {
        position: relative;
        height: 630px;
        box-sizing: border-box;
        padding: 64px 72px;
      }
      .kicker {
        font-size: 22px;
        letter-spacing: .18em;
        text-transform: uppercase;
        color: #7dd3fc;
        font-weight: 700;
      }
      h1 {
        margin: 18px 0 16px;
        font-size: 64px;
        line-height: 1.1;
        letter-spacing: -.03em;
      }
      p {
        margin: 0;
        max-width: 820px;
        font-size: 28px;
        line-height: 1.45;
        color: #cbd5e1;
      }
      .row {
        position: absolute;
        left: 72px;
        bottom: 56px;
        display: flex;
        gap: 16px;
      }
      .pill {
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(255,255,255,.08);
        border: 1px solid rgba(255,255,255,.12);
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="card">
      <div class="kicker">LangChain.js</div>
      <h1>中文手册 + 训练场</h1>
      <p>9 章精华 · 13 题浏览器内判题 · 无需 API Key</p>
      <div class="row">
        <div class="pill">Agent 优先</div>
        <div class="pill">模拟模型 + 真 API</div>
        <div class="pill">MIT</div>
      </div>
    </div>
  </body>
</html>
